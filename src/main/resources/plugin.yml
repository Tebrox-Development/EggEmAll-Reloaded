name: ${project.name}
version: ${project.version}
main: ${main.class}
authors:
  - shadmage
  - Tebrox
api-version: 1.21
provides: [ EggEmAll2 ]
softdepend: [ CMI, Vault, GriefPrevention, AuthMe, BanManager, BungeeChatAPI, DiscordSRV, Factions, Feudal, ItemsAdder, Essentials, LegacyFactions, Lands, LuckPerms, Multiverse-Core, MVdWPlaceholderAPI, MythicMobs, mcMMO, NashornPlus, Nicky, PlaceholderAPI, ProtocolLib, SimpleClans, Towny, TownyChat, WorldEdit, RoseStacker, UltimateStacker ]
website: https://github.com/Tebrox-Development/EggEmAll-Reloaded
description: Maintained fork of EggEmAll2 that lets players capture entities with chicken eggs.

permissions:
  eggemall.all:
    description: Gives access to catch all types of mobs.
    default: op
    children:
      eggemall.villagers: true
      eggemall.aggressive: true
      eggemall.passive: true
      eggemall.unknown: true
